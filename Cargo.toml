[workspace]
members = [
    "crates/core",
    "crates/smolrunners",
    "crates/launcher",
    "crates/collector",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
sha2 = "0.10"
lexopt = "0.3"
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.14"

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
