[workspace]
members = [
    "crates/core",
    "crates/smolrunners",
    "crates/launcher",
    "crates/collector",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
sha2 = "0.10"
lexopt = "0.3"
laputa-smol = { version = "=0.3.0", registry = "mycrates" }
laputa-async-io = { version = "=0.3.0", registry = "mycrates" }
laputa-async-net = { version = "=0.3.0", registry = "mycrates" }
laputa-async-executor = { version = "=0.3.0", registry = "mycrates" }
h12tiny-core = "=0.9.0"
h12tiny-server = "=0.9.0"
h12tiny-client = "=0.9.0"
rusqlite = { version = "0.43", features = ["bundled"] }
rustix = { package = "laputa-rustix", version = "=1.1.6", registry = "mycrates" }

[profile.release]
strip = true
lto = "thin"
