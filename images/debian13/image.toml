name = "debian13"
arch = ["arm64", "amd64"]
recipe = "build.sh"

[base]
image = "debian"
digest = "sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6"
release = "13"

[apt]
snapshot = "20261104T212339Z"
packages = ["libicu76"]

[inputs.arm64]
runner = "runner-linux-arm64"
docker = "docker-static-aarch64"
buildx = "buildx-linux-arm64"
node = "node-linux-arm64"
compose = "compose-linux-arm64"
collector = "tests/vm/bin/smolrunners-collector"

[inputs.amd64]
runner = "runner-linux-x64"
docker = "docker-static-x86_64"
buildx = "buildx-linux-amd64"
compose = "compose-linux-x64"
node = "node-linux-x64"
collector = "SMOLRUNNERS_COLLECTOR"

[layout]
runner_dir = "/opt/runner"
node_dir = "/opt/node"
docker_bin_dir = "/usr/local/bin"
buildx_plugin_dir = "/usr/local/lib/docker/cli-plugins"
smolrunners_dir = "/opt/smolrunners"
apt_sources = "/etc/apt/sources.list.d/debian.sources"
