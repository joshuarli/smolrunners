name = "debian-fixture"
arch = "arm64"
recipe = "build.sh"
base = "images/debian13"

[executor]
path = "tests/fixtures/executor"
target = "/opt/smolrunners/bin/executor"

[hooks]
started = "ACTIONS_RUNNER_HOOK_JOB_STARTED"
